<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Palavras Cruzadas</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<h1>Palavras Cruzadas</h1>

<table id="tabuleiro"></table>

<div class="botoes">
  <button onclick="conferir()">Conferir</button>
  <button onclick="reiniciar()">Reiniciar</button>
  <span id="contador">0 de 12 palavras</span>
</div>

<div class="pistas">
  <h2>Horizontais</h2>
  <ul id="horizontais"></ul>
  <h2>Verticais</h2>
  <ul id="verticais"></ul>
</div>

<script>
// Cada palavra: número, resposta, linha e coluna onde começa, direção (H ou V) e pista
var palavras = [
  { numero: 1,  resposta: "FLASH",          linha: 0, coluna: 10, direcao: "H", pista: "Memória não volátil apagada em blocos, usada em pendrives e cartões SD." },
  { numero: 3,  resposta: "CPU",            linha: 1, coluna: 2,  direcao: "H", pista: "Chip que executa as instruções dos programas e coordena o funcionamento do computador." },
  { numero: 5,  resposta: "UC",             linha: 3, coluna: 1,  direcao: "H", pista: "Componente do processador que busca, decodifica e comanda a execução das instruções." },
  { numero: 7,  resposta: "EEPROM",         linha: 3, coluna: 9,  direcao: "H", pista: "Memória não volátil que pode ser apagada e regravada eletricamente, byte a byte." },
  { numero: 8,  resposta: "MEMORIADEMASSA", linha: 5, coluna: 1,  direcao: "H", pista: "Dispositivo de grande capacidade, como HD ou SSD, que guarda arquivos de forma permanente." },
  { numero: 10, resposta: "RAM",            linha: 7, coluna: 3,  direcao: "H", pista: "Memória volátil principal onde ficam os programas em uso; apaga ao desligar." },
  { numero: 11, resposta: "REGISTRADORES",  linha: 9, coluna: 0,  direcao: "H", pista: "Pequenas posições de armazenamento dentro do processador, as mais rápidas de todas." },

  { numero: 2,  resposta: "ADDRESSBUS",     linha: 0, coluna: 12, direcao: "V", pista: "Conjunto de linhas pelas quais o processador indica qual posição da memória acessar." },
  { numero: 3,  resposta: "CACHE",          linha: 1, coluna: 2,  direcao: "V", pista: "Memória pequena e muito rápida que guarda cópias de dados usados com frequência." },
  { numero: 4,  resposta: "ULA",            linha: 1, coluna: 4,  direcao: "V", pista: "Parte do processador que realiza somas, subtrações e comparações lógicas." },
  { numero: 6,  resposta: "DMA",            linha: 3, coluna: 7,  direcao: "V", pista: "Controlador que transfere dados entre periféricos e memória sem ocupar o processador." },
  { numero: 9,  resposta: "ROM",            linha: 5, coluna: 5,  direcao: "V", pista: "Memória não volátil gravada de fábrica, cujo conteúdo normalmente não é alterado." }
];

var LINHAS = 10;
var COLUNAS = 15;

// Devolve a linha e a coluna da letra k da palavra p
function posicao(p, k) {
  if (p.direcao == "H") {
    return { linha: p.linha, coluna: p.coluna + k };
  } else {
    return { linha: p.linha + k, coluna: p.coluna };
  }
}

// 1) Monta a grade com as letras certas (matriz)
var grade = [];
for (var i = 0; i < LINHAS; i++) {
  grade[i] = [];
  for (var j = 0; j < COLUNAS; j++) {
    grade[i][j] = "";
  }
}
for (var n = 0; n < palavras.length; n++) {
  for (var k = 0; k < palavras[n].resposta.length; k++) {
    var pos = posicao(palavras[n], k);
    grade[pos.linha][pos.coluna] = palavras[n].resposta[k];
  }
}

// 2) Desenha o tabuleiro
var html = "";
for (var i = 0; i < LINHAS; i++) {
  html += "<tr>";
  for (var j = 0; j < COLUNAS; j++) {
    if (grade[i][j] == "") {
      html += "<td class='vazio'></td>";
    } else {
      // descobre se alguma palavra começa nesta casa para mostrar o número
      var numero = "";
      for (var n = 0; n < palavras.length; n++) {
        if (palavras[n].linha == i && palavras[n].coluna == j) {
          numero = palavras[n].numero;
        }
      }
      html += "<td><span class='num'>" + numero + "</span>";
      html += "<input maxlength='1' id='c" + i + "_" + j + "'></td>";
    }
  }
  html += "</tr>";
}
document.getElementById("tabuleiro").innerHTML = html;

// 3) Escreve as pistas
var textoH = "";
var textoV = "";
for (var n = 0; n < palavras.length; n++) {
  var p = palavras[n];
  var linhaPista = "<li id='pista" + n + "'>" + p.numero + ". " + p.pista +
                   " (" + p.resposta.length + " letras) <b id='status" + n + "'></b></li>";
  if (p.direcao == "H") {
    textoH += linhaPista;
  } else {
    textoV += linhaPista;
  }
}
document.getElementById("horizontais").innerHTML = textoH;
document.getElementById("verticais").innerHTML = textoV;

// 4) Botão Conferir
function conferir() {
  var acertos = 0;

  // limpa as cores anteriores
  for (var i = 0; i < LINHAS; i++) {
    for (var j = 0; j < COLUNAS; j++) {
      if (grade[i][j] != "") {
        document.getElementById("c" + i + "_" + j).className = "";
      }
    }
  }

  for (var n = 0; n < palavras.length; n++) {
    var p = palavras[n];

    // junta as letras digitadas nessa palavra
    var digitado = "";
    for (var k = 0; k < p.resposta.length; k++) {
      var pos = posicao(p, k);
      var campo = document.getElementById("c" + pos.linha + "_" + pos.coluna);
      digitado += campo.value.toUpperCase();
    }

    var certa = (digitado == p.resposta);
    if (certa) {
      acertos++;
      document.getElementById("pista" + n).className = "certa";
      document.getElementById("status" + n).innerHTML = "✔ certa";
    } else {
      document.getElementById("pista" + n).className = "errada";
      document.getElementById("status" + n).innerHTML = "✘ errada";
    }

    // pinta as casas da palavra (verde nunca é trocado por vermelho)
    for (var k = 0; k < p.resposta.length; k++) {
      var pos = posicao(p, k);
      var campo = document.getElementById("c" + pos.linha + "_" + pos.coluna);
      if (certa) {
        campo.className = "certa";
      } else if (campo.className != "certa") {
        campo.className = "errada";
      }
    }
  }

  document.getElementById("contador").innerHTML = acertos + " de " + palavras.length + " palavras";
}

// 5) Botão Reiniciar
function reiniciar() {
  // limpa as letras e as cores das casas
  for (var i = 0; i < LINHAS; i++) {
    for (var j = 0; j < COLUNAS; j++) {
      if (grade[i][j] != "") {
        var campo = document.getElementById("c" + i + "_" + j);
        campo.value = "";
        campo.className = "";
      }
    }
  }

  // limpa as cores e os avisos das pistas
  for (var n = 0; n < palavras.length; n++) {
    document.getElementById("pista" + n).className = "";
    document.getElementById("status" + n).innerHTML = "";
  }

  // zera o contador
  document.getElementById("contador").innerHTML = "0 de " + palavras.length + " palavras";
}
</script>

</body>
</html>
